dataset:
    binary: true
    data_dir: data/toy
    edge_list_file: out.toy
    mask_ratio: 0.32
    max_walk_length: 5
    multiedge_handling: keep
    name: toy
    num_walks: 10000
    remove_self_loops: true
    test_ratio: 0.1
    train_ratio: 0.48
    val_ratio: 0.1
float32_precision: medium
model:
    dropout: 0.5
    embedding_dim: 16
    hidden_dim: 16
    nhead: 2
    nlayers: 1
paths:
    append_timestamp: true
    base_outputs_dir: outputs
    use_dataset_outputs: true
preprocess:
    num_workers: 8
    save: true
    use_cache: true
reproducibility:
    seed: 42
training:
    batch_size: 2
    checkpoint_dir: checkpoints/
    early_stopping_patience: 10
    epochs: 10
    eval_only: false
    exp_name: walk_to_paint_experiment
    gradient_clip_val: 0.5
    log_dir: logs/
    lr: 0.001
    num_workers: 16
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
    resume_from_checkpoint: null
    use_cuda: true
    weight_decay: 0.001
