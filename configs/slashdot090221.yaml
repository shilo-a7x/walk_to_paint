# Slashdot090221 dataset-specific configuration
# Merges with base config.yaml - only overrides dataset-specific values

dataset:
    name: slashdot090221
    data_dir: data/slashdot090221
    edge_list_file: soc-sign-Slashdot090221.txt.gz
    remove_self_loops: true
    multiedge_handling: keep
    # Best Optuna hyperparams (trial #12, AUC=0.8529)
    max_walk_length: 80 # was 76
    num_walks: 1647606 # E25 edge_cover 3x|E| pick (flp 0.9007); zero-dup guarantee, matches/beats the old 5M
                       # k_cover budget (flp 0.9004, duplicated) at 1/3 the walks -- 5x and old-ref (5M) both
                       # tested flat-to-negative past this point -- see
                       # outputs/walk_coverage_analysis/E25_BUDGET_SWEEP_RESULTS.md
    walk_strategy: edge_cover # E25 SOTA (was k_cover k=5); zero-duplication guarantee, no k concept -- see
                               # outputs/walk_coverage_analysis/{E24_BP_SWEEP_RESULTS,E25_BUDGET_SWEEP_RESULTS}.md

model:
    embedding_dim: 128
    hidden_dim: 256
    nhead: 4
    nlayers: 4
    dropout: 0.005552095028163617

training:
    batch_size: 1024 # was 512
    epochs: 75 # was 50 (was 7 before that) -- E25 curves show best epoch 48/49, still climbing at the old
               # cap; raised with early_stopping_min_delta now set (config.yaml) so this only costs compute
               # if genuinely still improving -- see outputs/walk_coverage_analysis/E25_BUDGET_SWEEP_RESULTS.md
    lr: 0.0001237270037262604
    weight_decay: 0.00044649483303964814
    gradient_clip_val: 0.9500351813165078
    early_stopping_patience: 15 # was 17

optuna:
    # Keep initial_params aligned with the dataset/model/training values above
    initial_params:
        dataset:
            max_walk_length: 80
            num_walks: 1647606
        training:
            lr: 0.0001237270037262604
            weight_decay: 0.00044649483303964814
            batch_size: 1024
            gradient_clip_val: 0.9500351813165078
            early_stopping_patience: 15
            epochs: 75
        model:
            embedding_dim: 128
            hidden_dim: 256
            nhead: 4
            nlayers: 4
            dropout: 0.005552095028163617
