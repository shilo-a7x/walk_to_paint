dataset:
    name: wiki-rfa
    data_dir: data/wiki-RfA
    edge_list_file: wiki-RfA.txt.gz
    # If binary=true, VOT==0 entries are skipped and votes are mapped to {0,1}
    binary: false
    # Remove self-loops and pick most recent entry when multiple votes exist
    remove_self_loops: true
    multiedge_handling: most_recent
    # Reproducibility
    seed: 42

# Optuna starting point (useful as an initial trial/seed)
optuna:
    initial_params:
        dataset:
            max_walk_length: 83
            num_walks: 219589
        training:
            lr: 0.0011990397793339518
            weight_decay: 0.0026821863636421073
            batch_size: 64
            gradient_clip_val: 0.5956847053697083
            early_stopping_patience: 10
            epochs: 25
        model:
            embedding_dim: 32
            hidden_dim: 16
            nhead: 8
            nlayers: 5
            dropout: 0.6207573207736868
    # Optional filters example:
    # filter:
    #   min_year: 2005
    #   max_year: 2015
    #   allowed_votes: ["1", "-1"]

preprocess:
    save: false
    use_cache: false

paths:
    base_outputs_dir: outputs
    use_dataset_outputs: true
    append_timestamp: true
