# Wiki-RfA dataset-specific configuration
# Merges with base config.yaml - only overrides dataset-specific values
# Best Optuna trial: #87 (AUC=0.7779, maximized)

dataset:
    name: wiki-rfa
    data_dir: data/wiki-RfA
    edge_list_file: wiki-RfA.txt.gz
    # Wiki-RfA specific processing
    binary: true
    remove_self_loops: true
    multiedge_handling: most_recent
    # Best trial hyperparams (trial #87)
    max_walk_length: 80 # was 82
    num_walks: 265817 # E26 edge_cover 1.5x|E| pick (flp 0.8930); beats old k_cover k=5 1M SOTA (flp 0.8917,
                       # duplicated walks) at 27% of the walks -- confirmed the peak of a full floor/1.5x/3x/
                       # 5x/8x sweep (monotonic decline past 1.5x, same over-saturation shape as wiki-elec) --
                       # see outputs/walk_coverage_analysis/E26_WIKI_SWEEP_RESULTS.md
    walk_strategy: edge_cover # E26 SOTA (was k_cover k=5); zero-duplication guarantee, no k concept -- see
                               # outputs/walk_coverage_analysis/{E24_BP_SWEEP_RESULTS,E26_WIKI_SWEEP_RESULTS}.md

model:
    # Best trial hyperparams (trial #87)
    embedding_dim: 64
    hidden_dim: 64
    nhead: 2
    nlayers: 5
    dropout: 0.14736239940786994

training:
    # Best trial hyperparams (trial #87)
    batch_size: 1024 # was 512
    epochs: 50 # was 20
    lr: 0.0016135042002810406
    weight_decay: 2.9866739870000337e-05
    gradient_clip_val: 0.5394002549968298
    early_stopping_patience: 15 # was 5

# Optuna configuration for this dataset
optuna:
    # Keep initial_params aligned with the dataset/model/training values above
    initial_params:
        dataset:
            max_walk_length: 80
            num_walks: 265817
        training:
            lr: 0.0016135042002810406
            weight_decay: 2.9866739870000337e-05
            batch_size: 1024
            gradient_clip_val: 0.5394002549968298
            early_stopping_patience: 15
            epochs: 50
        model:
            embedding_dim: 64
            hidden_dim: 64
            nhead: 2
            nlayers: 5
            dropout: 0.14736239940786994
