dataset:
  name: toy
  data_dir: data/toy
  edge_list_file: out.toy
  walks_file: walks.json
  tokenizer_file: tokenizer.json
  encoded_file: encoded.pt
  edge_split_file: splits.json
  meta_file: meta.json
  max_walk_length: 5
  num_walks: 10000
  train_ratio: 0.7
  val_ratio: 0.1
  mask_ratio: 0.1
  test_ratio: 0.1

model:
  embedding_dim: 32
  hidden_dim: 16
  nhead: 4
  nlayers: 2
  dropout: 0.3

training:
  batch_size: 32
  epochs: 10
  lr: 0.001
  weight_decay: 0.01
  early_stopping_patience: 10
  gradient_clip_val: 1.0
  log_dir: logs/
  exp_name: walk_to_paint_experiment
  checkpoint_dir: checkpoints/
  resume_from_checkpoint: null
  eval_only: false
  use_cuda: true

preprocess:
  save: true
  use_cache: true

paths:
  base_outputs_dir: outputs
  use_dataset_outputs: true
  append_timestamp: true
