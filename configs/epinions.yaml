# Epinions dataset-specific configuration
# Merges with base config.yaml - only overrides dataset-specific values

dataset:
    name: epinions
    data_dir: data/epinions
    edge_list_file: soc-sign-epinions.txt.gz
    remove_self_loops: true
    multiedge_handling: keep
    # Best Optuna hyperparams (trial #31, AUC=0.9133)
    max_walk_length: 80 # was 79
    num_walks: 840799 # E25 edge_cover floor (=|E|) pick (flp 0.9527); zero-dup guarantee -- curve floor->5x
                       # is flat/noisy (0.34pp total range, non-monotonic), cheapest point taken since the
                       # spread doesn't clearly clear the diminishing-returns bar -- see
                       # outputs/walk_coverage_analysis/E25_BUDGET_SWEEP_RESULTS.md
    walk_strategy: edge_cover # E25 SOTA (was k_cover k=5); zero-duplication guarantee, no k concept -- see
                               # outputs/walk_coverage_analysis/{E24_BP_SWEEP_RESULTS,E25_BUDGET_SWEEP_RESULTS}.md

model:
    embedding_dim: 32
    hidden_dim: 32
    nhead: 8
    nlayers: 3
    dropout: 0.000861

training:
    batch_size: 1024 # was 256
    epochs: 75 # was 50 -- E25 curves show best epoch 42/49, still climbing at the old cap; raised with
               # early_stopping_min_delta now set (config.yaml) so this only costs compute if genuinely
               # still improving -- see outputs/walk_coverage_analysis/E25_BUDGET_SWEEP_RESULTS.md
    lr: 0.002936
    weight_decay: 0.000293
    gradient_clip_val: 0.1072
    early_stopping_patience: 15 # was 9

optuna:
    # Keep initial_params aligned with the dataset/model/training values above
    initial_params:
        dataset:
            max_walk_length: 80
            num_walks: 840799
        training:
            lr: 0.002936
            weight_decay: 0.000293
            batch_size: 1024
            gradient_clip_val: 0.1072
            early_stopping_patience: 15
            epochs: 75
        model:
            embedding_dim: 32
            hidden_dim: 32
            nhead: 8
            nlayers: 3
            dropout: 0.000861
