# Epinions dataset-specific configuration
# Merges with base config.yaml - only overrides dataset-specific values

dataset:
    name: epinions
    data_dir: data/epinions
    edge_list_file: soc-sign-epinions.txt.gz
    remove_self_loops: true
    multiedge_handling: keep
    # Best Optuna hyperparams (trial #31, AUC=0.9133)
    max_walk_length: 79
    num_walks: 4966522

model:
    embedding_dim: 32
    hidden_dim: 32
    nhead: 8
    nlayers: 3
    dropout: 0.000861

training:
    batch_size: 256
    epochs: 25
    lr: 0.002936
    weight_decay: 0.000293
    gradient_clip_val: 0.1072
    early_stopping_patience: 9

optuna:
    initial_params:
        dataset:
            max_walk_length: 79
            num_walks: 4966522
        training:
            lr: 0.002936
            weight_decay: 0.000293
            batch_size: 256
            gradient_clip_val: 0.1072
            early_stopping_patience: 9
            epochs: 25
        model:
            embedding_dim: 32
            hidden_dim: 32
            nhead: 8
            nlayers: 3
            dropout: 0.000861
