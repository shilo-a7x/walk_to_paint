    walk_k_min: 1
    max_walk_length: 80
    num_walks: 840799
  model:
    embedding_dim: 32
    hidden_dim: 32
    dropout: 0.000861
    nhead: 8
    nlayers: 3
    dynamic_train_masking: true
    dynamic_train_mask_seed_offset: 0
    node_context_mode: replace
    node_replace_prob: 0.2
    node_replace_unk_ratio: 0.7
    local_attention_window: 4
    hardness_lambda: 1.0
    hardness_map_path: null
    vocab_size: 131585
    num_classes: 2
    pad_id: 0
    ignore_index: -1
    unk_id: 2
    mask_id: 1
    class_weights:
    - 1.671326116952434
    - 0.32867388304756606
  miner:
    epochs: 5
    embedding_dim: 16
    hidden_dim: 16
    nhead: 2
    nlayers: 2
    lr: 0.001
    batch_size: 1024
  training:
    batch_size: 1024
    epochs: 75
    lr: 0.002936
    weight_decay: 0.000293
    early_stopping_patience: 15
    early_stopping_min_delta: 0.001
    gradient_clip_val: 0.1072
    log_dir: outputs/epinions/MULTISEED_s43_local_20260806-153529/logs
    exp_name: MULTISEED_s43_local
    checkpoint_dir: outputs/epinions/MULTISEED_s43_local_20260806-153529/checkpoints
    resume_from_checkpoint: null
    eval_only: false
    use_cuda: true
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    bucket_batching: true
    bucket_width: 4
    callbacks:
      enable_prediction_saver: false
      enable_per_epoch_test_runner: false
      save_every: 0
  paths:
    base_outputs_dir: outputs
    use_dataset_outputs: true
    append_timestamp: true
  float32_precision: medium
  optuna:
    initial_params:
      dataset:
        max_walk_length: 80
