    edge_list_file: soc-sign-epinions.txt.gz
    train_ratio: 0.48
    mask_ratio: 0.32
    val_ratio: 0.1
    test_ratio: 0.1
    binary: true
    remove_self_loops: true
    multiedge_handling: keep
    walk_strategy: edge_cover
    walk_neg_emphasis_fraction: 0.5
    walk_set_cover_multiplier: 4
