cfg:
  reproducibility:
    seed: 42
  preprocess:
    save: true
    use_cache: true
    use_mmap: true
    num_workers: 8
  dataset:
    name: epinions
    data_dir: data/epinions
    edge_list_file: soc-sign-epinions.txt.gz
    train_ratio: 0.48
    mask_ratio: 0.32
    val_ratio: 0.1
    test_ratio: 0.1
    binary: true
    remove_self_loops: true
    multiedge_handling: keep
    walk_strategy: edge_cover
    walk_neg_emphasis_fraction: 0.5
    walk_set_cover_multiplier: 4
    walk_p: 1.0
    walk_q: 1.0
    walk_k_min: 1
    max_walk_length: 80
    num_walks: 840799
  model:
    embedding_dim: 64
    hidden_dim: 192
    dropout: 0.12573189613897345
    nhead: 8
    nlayers: 5
    dynamic_train_masking: true
    dynamic_train_mask_seed_offset: 0
    node_context_mode: replace
    node_replace_prob: 0.49761678732266795
    node_replace_unk_ratio: 0.5854458744914186
    local_attention_window: 4
    hardness_lambda: 1.0
    hardness_map_path: null
    scramble_edge_signs: false
    eid_reveal_holdout_identity: true
    vocab_size: 972384
    old_vocab_size: 131585
    eid_cache_path: experiments/edge_identity_tokens/cache/epinions_nw840799_eid.pt
    num_classes: 2
    pad_id: 0
    ignore_index: -1
    unk_id: 2
    mask_id: 1
    class_weights:
    - 1.673301231313379
    - 0.3266987686866211
    edge_embed_rank: 10
    edge_sign_combine: concat
    edge_residual_baseline: false
    sign_embed_dim: 12
    node_embed_dim: 64
    edge_embed_weight_decay: 0.0005211075735425759
    edge_replace_prob: 0.4277388203735928
    edge_replace_unk_ratio: 0.41326268339269157
  miner:
    epochs: 5
    embedding_dim: 16
    hidden_dim: 16
    nhead: 2
    nlayers: 2
    lr: 0.001
    batch_size: 1024
  training:
    batch_size: 1024
    epochs: 75
    lr: 0.0012312652878581712
    weight_decay: 0.000293
    early_stopping_patience: 15
    early_stopping_min_delta: 0.001
    gradient_clip_val: 0.1072
    log_dir: outputs/epinions/EID_GAP_EPINIONS_ARCH/logs
    exp_name: EID_GAP_EPINIONS_ARCH-t18
    checkpoint_dir: outputs/epinions/EID_GAP_EPINIONS_ARCH/checkpoints
    resume_from_checkpoint: null
    eval_only: false
    use_cuda: true
    num_workers: 4
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2
    bucket_batching: true
    bucket_width: 4
    callbacks:
