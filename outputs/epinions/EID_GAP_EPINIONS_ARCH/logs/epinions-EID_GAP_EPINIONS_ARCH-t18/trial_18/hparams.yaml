      enable_per_epoch_test_runner: false
      save_every: 0
    log_epoch_figures: false
  paths:
    base_outputs_dir: outputs
    use_dataset_outputs: true
    append_timestamp: false
  float32_precision: medium
  optuna:
    initial_params:
      dataset:
        max_walk_length: 80
        num_walks: 840799
      training:
        lr: 0.002936
        weight_decay: 0.000293
        batch_size: 1024
        gradient_clip_val: 0.1072
        early_stopping_patience: 15
        epochs: 75
      model:
        embedding_dim: 32
        hidden_dim: 32
        nhead: 8
        nlayers: 3
        dropout: 0.000861
