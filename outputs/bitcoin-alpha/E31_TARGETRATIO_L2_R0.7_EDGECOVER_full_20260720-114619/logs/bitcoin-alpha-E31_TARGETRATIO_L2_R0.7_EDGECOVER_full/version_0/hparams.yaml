cfg:
  reproducibility:
    seed: 42
  preprocess:
    save: true
    use_cache: true
    use_mmap: true
    num_workers: 8
  dataset:
    name: bitcoin-alpha
    data_dir: data/bitcoin-alpha
    edge_list_file: soc-sign-bitcoinalpha.csv.gz
    train_ratio: 0.48
    mask_ratio: 0.32
    val_ratio: 0.1
    test_ratio: 0.1
    binary: true
    remove_self_loops: true
    multiedge_handling: most_recent
    walk_strategy: edge_cover
    walk_neg_emphasis_fraction: 0.5
    walk_set_cover_multiplier: 4
    walk_p: 1.0
    walk_q: 1.0
    walk_k_min: 1
    max_walk_length: 2
    num_walks: 120930
  model:
    embedding_dim: 64
    hidden_dim: 128
    dropout: 0.2
    nhead: 4
    nlayers: 3
    dynamic_train_masking: true
    dynamic_train_mask_seed_offset: 0
    node_context_mode: replace
    node_replace_prob: 0.2
    node_replace_unk_ratio: 0.7
    local_attention_window: null
    hardness_lambda: 0
    hardness_map_path: null
    dynamic_target_ratio: 0.7
    vocab_size: 3788
    num_classes: 2
    pad_id: 0
    ignore_index: -1
    unk_id: 2
    mask_id: 1
    class_weights:
    - 1.9023538773519522
    - 0.09764612264804785
  miner:
    epochs: 5
    embedding_dim: 16
    hidden_dim: 16
    nhead: 2
    nlayers: 2
    lr: 0.001
    batch_size: 1024
  training:
    batch_size: 1024
    epochs: 50
    lr: 0.0016
    weight_decay: 0.0001
    early_stopping_patience: 15
    early_stopping_min_delta: 0.001
    gradient_clip_val: 0.54
    log_dir: outputs/bitcoin-alpha/E31_TARGETRATIO_L2_R0.7_EDGECOVER_full_20260720-114619/logs
    exp_name: E31_TARGETRATIO_L2_R0.7_EDGECOVER_full
    checkpoint_dir: outputs/bitcoin-alpha/E31_TARGETRATIO_L2_R0.7_EDGECOVER_full_20260720-114619/checkpoints
    resume_from_checkpoint: null
    eval_only: false
    use_cuda: true
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    bucket_batching: true
    bucket_width: 4
    callbacks:
      enable_prediction_saver: false
      enable_per_epoch_test_runner: false
      save_every: 0
  paths:
    base_outputs_dir: outputs
    use_dataset_outputs: true
    append_timestamp: true
  float32_precision: medium
  optuna:
    initial_params:
      dataset:
        max_walk_length: 80
        num_walks: 120930
      training:
        lr: 0.0016
        weight_decay: 0.0001
        batch_size: 1024
        gradient_clip_val: 0.54
        early_stopping_patience: 15
        epochs: 50
      model:
        embedding_dim: 64
        hidden_dim: 128
        nhead: 4
        nlayers: 3
        dropout: 0.2
