dataset:
    data_dir: data/toy
    edge_list_file: out.toy
    mask_ratio: 0.1
    max_walk_length: 5
    name: toy
    num_walks: 10000
    train_ratio: 0.7
    val_ratio: 0.1
model:
    dropout: 0.3
    embedding_dim: 32
    hidden_dim: 16
    nhead: 4
    nlayers: 2
preprocess:
    save: true
    use_cache: true
training:
    batch_size: 32
    checkpoint_dir: checkpoints/
    early_stopping_patience: 10
    epochs: 10
    eval_only: false
    exp_name: walk_to_paint_experiment
    gradient_clip_val: 1.0
    log_dir: logs/
    lr: 1e-3
    resume_from_checkpoint: null
    use_cuda: true
    weight_decay: 1e-2
